{{/*
AAP config-as-code instance groups reference ServiceAccounts by the names
"osac-sa" and "template-publisher" (hardcoded in the osac-aap playbooks).
The AAP Helm subchart creates SAs with an "osac-aap-" prefix instead.

TODO: Fix the naming mismatch in the osac-aap repo — either the subchart
should drop the prefix or config-as-code should use the subchart names.
Once fixed upstream, remove this file.
*/}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: osac-sa
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: osac-sa-{{ .Release.Namespace }}
  labels:
    {{- include "osac.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: osac-sa
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: template-publisher
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: create-controller-token
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    resourceNames: ["template-publisher"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aap-fulfillment-template-publisher-binding
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: create-controller-token
subjects:
  - kind: ServiceAccount
    name: template-publisher
    namespace: {{ .Release.Namespace }}
