{{- if .Values.kafka.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: osac-prereqs-kafka-config
  labels:
    {{- include "osac-prereqs.labels" . | nindent 4 }}
data:
  kafka-cluster.yaml: |
    apiVersion: kafka.strimzi.io/v1beta2
    kind: KafkaNodePool
    metadata:
      name: dual-role
      namespace: osac-kafka
      labels:
        strimzi.io/cluster: osac-kafka
    spec:
      replicas: {{ .Values.kafka.replicas }}
      roles:
        - controller
        - broker
      storage:
        type: persistent-claim
        size: {{ .Values.kafka.storage.size }}
        deleteClaim: false
    ---
    apiVersion: kafka.strimzi.io/v1beta2
    kind: Kafka
    metadata:
      name: osac-kafka
      namespace: osac-kafka
      annotations:
        strimzi.io/kraft: enabled
        strimzi.io/node-pools: enabled
    spec:
      kafka:
        version: {{ .Values.kafka.version | quote }}
        metadataVersion: {{ .Values.kafka.metadataVersion | quote }}
        listeners:
          - name: tls
            port: 9093
            type: internal
            tls: true
            authentication:
              type: scram-sha-512
        config:
          offsets.topic.replication.factor: {{ .Values.kafka.replicas }}
          transaction.state.log.replication.factor: {{ .Values.kafka.replicas }}
          transaction.state.log.min.isr: {{ min .Values.kafka.replicas 2 }}
          default.replication.factor: {{ .Values.kafka.replicas }}
          min.insync.replicas: {{ min .Values.kafka.replicas 2 }}
        authorization:
          type: simple
      entityOperator:
        topicOperator: {}
        userOperator: {}
  kafka-topics.yaml: |
    apiVersion: kafka.strimzi.io/v1beta2
    kind: KafkaTopic
    metadata:
      name: osac.metering.lifecycle
      namespace: osac-kafka
      labels:
        strimzi.io/cluster: osac-kafka
    spec:
      partitions: 24
      replicas: {{ .Values.kafka.replicas }}
      config:
        retention.ms: "{{ mul .Values.kafka.retention.standardDays 86400000 }}"
        min.insync.replicas: "{{ min .Values.kafka.replicas 2 }}"
        cleanup.policy: delete
    ---
    apiVersion: kafka.strimzi.io/v1beta2
    kind: KafkaTopic
    metadata:
      name: osac.metering.heartbeat
      namespace: osac-kafka
      labels:
        strimzi.io/cluster: osac-kafka
    spec:
      partitions: 24
      replicas: {{ .Values.kafka.replicas }}
      config:
        retention.ms: "{{ mul .Values.kafka.retention.standardDays 86400000 }}"
        min.insync.replicas: "{{ min .Values.kafka.replicas 2 }}"
        cleanup.policy: delete
    ---
    apiVersion: kafka.strimzi.io/v1beta2
    kind: KafkaTopic
    metadata:
      name: osac.metering.inference
      namespace: osac-kafka
      labels:
        strimzi.io/cluster: osac-kafka
    spec:
      partitions: 12
      replicas: {{ .Values.kafka.replicas }}
      config:
        retention.ms: "{{ mul .Values.kafka.retention.standardDays 86400000 }}"
        min.insync.replicas: "{{ min .Values.kafka.replicas 2 }}"
        cleanup.policy: delete
    ---
    apiVersion: kafka.strimzi.io/v1beta2
    kind: KafkaTopic
    metadata:
      name: osac.metering.corrections
      namespace: osac-kafka
      labels:
        strimzi.io/cluster: osac-kafka
    spec:
      partitions: 6
      replicas: {{ .Values.kafka.replicas }}
      config:
        retention.ms: "{{ mul .Values.kafka.retention.standardDays 86400000 }}"
        min.insync.replicas: "{{ min .Values.kafka.replicas 2 }}"
        cleanup.policy: delete
    ---
    apiVersion: kafka.strimzi.io/v1beta2
    kind: KafkaTopic
    metadata:
      name: osac.metering.dlq
      namespace: osac-kafka
      labels:
        strimzi.io/cluster: osac-kafka
    spec:
      partitions: 6
      replicas: {{ .Values.kafka.replicas }}
      config:
        retention.ms: "{{ mul .Values.kafka.retention.dlqDays 86400000 }}"
        min.insync.replicas: "{{ min .Values.kafka.replicas 2 }}"
        cleanup.policy: delete
  kafka-user.yaml: |
    apiVersion: kafka.strimzi.io/v1beta2
    kind: KafkaUser
    metadata:
      name: osac-metering
      namespace: osac-kafka
      labels:
        strimzi.io/cluster: osac-kafka
    spec:
      authentication:
        type: scram-sha-512
      authorization:
        type: simple
        acls:
          - resource:
              type: topic
              name: osac.metering.
              patternType: prefix
            operations:
              - Write
              - Describe
            host: "*"
{{- end }}
